steps:
# 1. Adım: Docker imajını derle (Build)
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/ikinci-el-web:latest', '.']

# 2. Adım: İmajı Google Container Registry'ye gönder (Push)
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/ikinci-el-web:latest']

# 3. Adım: Kubernetes (GKE) üzerine manifest dosyalarını uygula (Deploy)
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'k8s/']
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a' # Cluster'ı oluştururken seçeceğimiz bölge
  - 'CLOUDSDK_CONTAINER_CLUSTER=magaza-cluster' # Cluster'ımızın adı

  options:
  logging: CLOUD_LOGGING_ONLY